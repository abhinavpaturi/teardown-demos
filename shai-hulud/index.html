:root{--paper:#e9e2d4;--mute:#b8b0a1;--sand:#e5b779;--line:#454039;--ink:#171713;--mono:'JetBrains Mono',monospace;font:15px/1.4 'Inter',Arial,sans-serif;color:var(--paper);background:var(--ink);color-scheme:dark;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,a{font:inherit}button{color:inherit;background:transparent;border:0;cursor:pointer}button:hover{color:#fff1d9}button:focus-visible,input:focus-visible,a:focus-visible,canvas:focus-visible{outline:2px solid #f5c987;outline-offset:3px}svg{flex:none;vertical-align:middle}.mast,.brand,.ledger-button,.upper,.drivehead,.kicker,.eyebrow,.cam,.figure,.hide,.dialogtop,#tour,#play{display:flex;align-items:center}.mast{height:59px;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 3.5%;background:#151612}.brand{gap:12px}.brand>svg{color:var(--sand)}.brand strong{font-size:19px;font-weight:540;letter-spacing:-.052em}.brand i,.cam i{height:15px;width:1px;background:var(--line);margin:0 7px}.brand span,.kicker,.eyebrow,.figure,.cam span,footer{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.brand span{color:var(--mute);letter-spacing:.14em}.ledger-button{font-size:13px;gap:8px;padding:8px 0}.ledger-button>svg:first-child{color:var(--sand)}
.stage{height:clamp(425px,61vh,840px);overflow:hidden;position:relative;isolation:isolate;background:#8c735b;border-bottom:1px solid #5d5040}#view{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#view:active{cursor:grabbing}.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#160f0b50,transparent 49%),linear-gradient(0deg,#1e160f36,transparent 18%)}.hero,.figure,.hide,.cam,#load{position:absolute}.hero{top:6.6%;left:3.5%;pointer-events:none;color:#fcf2da;text-shadow:0 1px 14px #34271970}.eyebrow{gap:9px;color:#f7dfb6;font-size:10px;font-weight:550}.eyebrow b{height:1px;width:28px;background:currentColor}.eyebrow i,.kicker i,footer i{font-style:normal;color:#9e8f77}.hero h1{font:normal clamp(56px,5.55vw,95px)/.99 Georgia,serif;letter-spacing:-.07em;margin:12px 0 7px}.hero p{margin:0;font-size:15px;letter-spacing:.005em;color:#f3e6cf}.figure{right:3.5%;top:7%;gap:7px;font-size:10px;color:#fff0d6;text-shadow:0 1px 4px #574126}.figure i{width:18px;height:1px;background:#e3ceb1}.figure b{font-weight:600}.hide,.cam{bottom:18px;background:#201e19cb;backdrop-filter:blur(5px);border:1px solid #bcab8d66;border-radius:3px;height:35px;color:#f7eddc}.hide{left:3.5%;gap:7px;padding:0 10px;font-size:12px}.hide kbd{font:10px var(--mono);border:1px solid #766e60;border-radius:2px;padding:0 4px}.cam{right:3.5%;padding:0 3px}.cam span{font-size:9px;color:#d4c4a9}.cam i{margin:0 3px;background:#7c7468}.cam button{height:30px;min-width:30px;padding:0 5px}.cam button:hover{background:#504333}#load{left:50%;top:50%;transform:translate(-50%,-50%);font:12px var(--mono);color:#fff5de;background:#25231ee8;border:1px solid #b8a583;padding:12px 18px;text-align:center}
.console{padding:17px 3.5% 0;max-width:2100px;margin:auto}.upper,.drivehead,.dialogtop{justify-content:space-between}.kicker{font-weight:600;gap:9px;color:#d3b68f}.kicker b{width:6px;height:6px;background:#d3a66c}.kicker.small{color:#bab4a5;font-size:10px}.kicker span{color:var(--sand)}#tour,#play{gap:6px;font-size:12px;color:#eacb9c;border:1px solid #605542;border-radius:3px;padding:4px 9px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 0}.modes button{padding:9px 12px 11px;text-align:left;border:1px solid #474238;background:#1c1c17;font-size:15px;display:flex;align-items:center;gap:12px;border-radius:2px;color:#c2bbae}.modes small{font:10px var(--mono);color:#a29682}.modes [aria-pressed=true]{border-color:#c8a16e;background:#30291e;color:#f5e7ce}.modes [aria-pressed=true] small{color:#e6ba7f}
.lower{display:grid;grid-template-columns:1.02fr 1fr;gap:clamp(18px,5%,75px);padding:20px 0}.study h2{font:normal 25px/1.12 Georgia,serif;letter-spacing:-.03em;margin:7px 0 3px}.study p{font-size:13px;color:var(--mute);margin:0;max-width:610px;line-height:1.46}.stats{display:flex;align-items:stretch;margin-top:15px;gap:clamp(12px,3.8vw,62px)}.stats>div,.stats>button{padding:0;text-align:left;white-space:nowrap}.stats span{display:block;font-size:11px;color:#bdb3a4}.stats span svg{color:var(--sand)}.stats strong{display:block;font-size:clamp(21px,1.8vw,29px);letter-spacing:-.055em;font-weight:520;line-height:1.2;font-variant-numeric:tabular-nums}#n-parts{color:#ecc694}#length em{font:10px var(--mono);letter-spacing:0;color:var(--mute);margin-left:3px}.drive{border-left:1px solid var(--line);padding-left:clamp(16px,2vw,30px)}.sliders label{display:grid;grid-template-columns:126px 1fr 57px;align-items:center;gap:12px;font-size:13px;color:#d3cabc;min-height:32px}.sliders{margin-top:5px}.sliders output{font:11px var(--mono);text-align:right;color:#e2bc88}.sliders input{width:100%;min-width:0;margin:0;appearance:none;accent-color:var(--sand);height:24px;background:transparent}.sliders input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,#d7ab74 var(--pct,50%),#4f493e var(--pct,50%))}.sliders input::-webkit-slider-thumb{appearance:none;background:#ecd5ad;height:10px;width:10px;border-radius:50%;margin-top:-3.5px}.sliders input::-moz-range-track{background:#71624f;height:3px}.sliders input::-moz-range-thumb{background:#ecd5ad;border:0;width:10px;height:10px;border-radius:50%}
footer{padding:11px 3.5% 14px;border-top:1px solid #35332c;color:#b1a695;display:flex;justify-content:space-between;font-size:8px}footer i{margin:0 6px}dialog{width:min(570px,94vw);max-height:85dvh;overflow:auto;border:1px solid #726653;border-radius:4px;background:#20201b;color:var(--paper);padding:22px 24px;box-shadow:0 15px 75px #0009}dialog::backdrop{background:#080704a8}dialog h2{font:36px/1 Georgia,serif;margin:18px 0 10px;letter-spacing:-.05em}dialog .intro{color:#c2b9a7;font-size:14px}dialog .intro strong{color:var(--sand)}.manifest-head,.manifest-row{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.manifest-head{padding:12px 0 5px;border-bottom:1px solid #65583e;color:var(--sand);font:11px var(--mono);text-transform:uppercase}.manifest-row{padding:4px 0;color:#d2c9bb;font-size:13px}.manifest-row small{font:11px var(--mono);color:#bfaf96}.source-note{font-size:12px;color:var(--mute);line-height:1.5;border-top:1px solid #514b40;margin-top:16px;padding-top:10px}.source-note a{display:block;color:var(--sand);text-decoration:none}
html.clean,html.clean body{overflow:hidden}.clean .stage{position:fixed;inset:0;z-index:20;width:100%;height:100%;border:0}.clean :is(.hero,.veil,.figure,.mast,.console,footer,.cam){display:none}.clean .hide{opacity:0;pointer-events:none}.clean .hide:focus-visible,.clean .stage.peek .hide{opacity:1;pointer-events:auto}

@media(max-width:360px){.modes{grid-template-columns:1fr 1fr}.stats{gap:19px}.hero h1{font-size:47px}.ledger-button>svg:last-child{display:none}}
